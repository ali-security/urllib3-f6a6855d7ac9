name: CI

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  lint:
    # Seal: disabled on the fork. `nox -s lint` installs unpinned
    # black/isort/flake8, so present-day formatters reject 2021-era formatting.
    # Lint produces no artifact and runs no tests.
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
      - name: Install dependencies
        run: python -m pip install nox
      - name: Lint the code
        run: nox -s lint

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      # Seal: upstream pinned Python 3.7, which no longer exists on hosted
      # runners. 3.9 is the closest available interpreter and the wheel is
      # universal (py2.py3-none-any), so the artifact content is unaffected.
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Check packages
        # Seal: registry time machine + explicit setuptools/wheel pins so the
        # rebuilt wheel keeps the released `Generator: bdist_wheel (0.36.2)`
        # and the released metadata shape.
        env:
          PIP_INDEX_URL: https://:2021-05-26@time-machines-pypi.sealsecurity.io/
        run: |
          python -m pip install "setuptools==54.2.0" "wheel==0.36.2" twine rstcheck;
          python setup.py sdist bdist_wheel;
          rstcheck README.rst CHANGES.rst
          python -m twine check dist/*
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        # Seal: upstream tested 2.7/3.5/3.6/3.7/3.8, none of which exist on
        # current hosted runners (and macos-latest is arm64, which has no
        # interpreter below 3.9). 3.10 is the newest interpreter this 2021
        # dependency set (tornado 6.0.3, pytest 6.2.4) supports and is
        # available on all three OSes.
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            # Release-date graph: everything but the two legs below resolves.
            pip-index-date: "2021-05-26"
          # Seal: macOS and Windows cannot resolve the release-date graph.
          # Windows: pytest 6.2.4 requires atomicwrites, whose entire file
          # history was re-uploaded to PyPI on 2022-07-09, so a date-filtered
          # mirror has no atomicwrites before then.
          # macOS: setup-python ships a macosx-10.9-universal2 interpreter, and
          # no cryptography with a universal2 wheel existed until 35.0.0
          # (2021-09); 3.4.7 would be compiled from source and fails without
          # OpenSSL headers.
          - os: macos-latest
            python-version: "3.10"
            pip-index-date: "2022-07-15"
          - os: windows-latest
            python-version: "3.10"
            pip-index-date: "2022-07-15"
          # Seal: upstream covered Linux in .travis.yml (os: linux) with
          # NOX_SESSION=test-2.7 .. test-3.8. Travis is gone; 2.7 is restored here
          # as an ubuntu leg on the release-date graph, which is what exercises the
          # py2-specific code the CVE-2025-66471 decoder rework adds.
          - os: ubuntu-latest
            python-version: "2.7"
            pip-index-date: "2021-05-26"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.python-version }})
    timeout-minutes: 75
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python - ${{ matrix.python-version }}
        if: matrix.python-version != '2.7'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # CPython 2.7 has no prebuilt for current runners, so it is built from source.
      - name: Build Python - ${{ matrix.python-version }}
        if: matrix.python-version == '2.7'
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache-build: true
          allow-build: allow

      # 3.11, not "3": "3" resolves to 3.14, and stdlib `pipes` (removed in 3.13) is
      # imported by virtualenv < 20.22, the last line supporting py2.7.
      - name: Set Up Python 3 to run nox
        if: matrix.python-version == '2.7'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # lazy-object-proxy 1.7.0 claims Requires-Python ">=2.7,..." but its setup.py
      # uses a bare `super()`; upstream re-tagged the next release as ">=3.6" the same
      # day. It arrives only via gcp-devrel-py-tools -> astroid<2.0, an app_engine-only
      # dev-requirement. Scoped to this leg via GITHUB_ENV.
      - if: matrix.python-version == '2.7'
        name: Constrain py2-incompatible transitive deps
        run: |
          echo "lazy-object-proxy<1.7" > "$RUNNER_TEMP/py27-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/py27-constraints.txt" >> "$GITHUB_ENV"

      # virtualenv >= 20.22 dropped Python 2.7; upstream pinned it for the same reason.
      # argcomplete 3.7.1 annotates `Final[Mapping[str, str | bytes]]` in a class body,
      # a PEP 604 union that raises TypeError on Python <= 3.9, so nox fails to import.
      - if: matrix.python-version == '2.7'
        name: Install Dependencies (py2.7 leg)
        run: |
          echo "argcomplete<3.7.1" > "$RUNNER_TEMP/nox-constraints.txt"
          PIP_CONSTRAINT="$RUNNER_TEMP/nox-constraints.txt" python -m pip install --upgrade nox 'virtualenv<20.22.0'

      - if: matrix.python-version != '2.7'
        name: Install Dependencies
        run: python -m pip install --upgrade nox

      - name: Run Tests
        run: ./ci/run_tests.sh
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          # Seal: freeze the dependency graph to the release date so the
          # 2021 pins in dev-requirements.txt resolve consistently.
          PIP_INDEX_URL: https://:${{ matrix.pip-index-date }}@time-machines-pypi.sealsecurity.io/
